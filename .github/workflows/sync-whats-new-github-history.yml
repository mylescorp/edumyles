name: Sync What's New repository history

on:
  workflow_dispatch:
  pull_request_target:
    types: [closed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sync-whats-new-history-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    name: Sync merged repository history
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Sync merged pull requests and commits
        run: node scripts/sync-whats-new-github-history.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          WHATS_NEW_RELEASE_SECRET: ${{ secrets.WHATS_NEW_RELEASE_SECRET }}
