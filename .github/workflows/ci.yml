name: CI

on:
  pull_request:
    branches: [main, staging, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & Type Check ───────────────────────────────────────────────────────
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

  # ── Unit Tests ──────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── Tenant Isolation Tests ───────────────────────────────────────────────────
  tenant-isolation:
    name: Tenant Isolation Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tenant isolation tests
        run: npm run test:tenant-isolation

  # ── E2E Tests ───────────────────────────────────────────────────────────────
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Convex Node actions require Node 22 or 24. Keep this isolated to
          # E2E, which provisions a disposable local Convex deployment.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Configure disposable local Convex deployment
        env:
          CONVEX_AGENT_MODE: anonymous
        run: |
          # The initial local setup creates .env.local before module analysis.
          # Push is expected to stop at the WorkOS module until its harmless
          # placeholder key is configured on this throwaway deployment.
          npx convex dev --local --once > /tmp/convex-local-bootstrap.log 2>&1 || true
          npx convex env set WORKOS_API_KEY sk_test_local_ci_placeholder

      - name: Run Playwright smoke suite
        env:
          CONVEX_AGENT_MODE: anonymous
        run: >-
          npx convex dev --local --once --run-sh
          'cp .env.local frontend/.env.local && npm run test:e2e:smoke'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── Convex Schema Validation ─────────────────────────────────────────────────
  convex-schema-check:
    name: Convex Schema & Types
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check Convex functions
        # Validates schema.ts, all query/mutation/action files, and generated types
        run: npx tsc --noEmit --project convex/tsconfig.json

  # ── Mobile Lint, Type Check & Tests ─────────────────────────────────────────
  mobile-check:
    name: Mobile Lint, Types & Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check mobile
        working-directory: mobile
        run: node ../node_modules/typescript/bin/tsc --noEmit

      - name: Lint mobile
        working-directory: mobile
        run: npx eslint src --ext .ts,.tsx --max-warnings=0

      - name: Run mobile tests
        run: npm test --workspace=mobile

  # ── Security Audit ──────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
